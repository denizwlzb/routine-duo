<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<title>Rituel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: no cards. One colored block for the current moment of the day (sun yellow in the morning, night blue in the evening), then plain rows on paper. */
:root{
  --paper:#F4F5F7; --surface:#FFFFFF; --ink:#101114; --mute:#6A6F78; --line:#DCDFE4;
  --sun:#FFD23F; --sun-ink:#1B1600; --night:#242B63; --night-ink:#F3F1FF; --hot:#FF5A1F;
  --display:'Unbounded','Arial Black',sans-serif; --body:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D0E11; --surface:#17191E; --ink:#F2F3F5; --mute:#9399A3; --line:#272A32;
    --night:#2F3890; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D0E11; --surface:#17191E; --ink:#F2F3F5; --mute:#9399A3; --line:#272A32;
  --night:#2F3890; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;line-height:1.12}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 112px;display:flex;flex-direction:column;gap:26px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hdr .d{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.hdr h1{font-size:22px;margin-top:4px}
.streak{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:20px}
.streak svg{width:22px;height:22px}
.hero{border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.hero.matin{background:var(--sun);color:var(--sun-ink)}
.hero.soir{background:var(--night);color:var(--night-ink)}
.hero .lab{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:30px}
.hero .sm{font-size:15px;opacity:.85}
.seg{display:flex;gap:6px}
.seg i{flex:1;height:8px;border-radius:4px;background:currentColor;opacity:.25}
.seg i.on{opacity:1}
.btn{border:0;border-radius:999px;min-height:54px;padding:0 26px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--ink);color:var(--paper)}
.hero.matin .btn{background:var(--sun-ink);color:var(--sun)}
.hero.soir .btn{background:var(--night-ink);color:var(--night)}
.btn.line{background:transparent;color:inherit;border:2px solid currentColor}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot.part{border-color:var(--ink);background:conic-gradient(var(--ink) 0 50%,transparent 0)}
.dot.full{border-color:var(--ink);background:var(--ink)}
.dot svg{width:16px;height:16px;opacity:0}
.dot.full svg{opacity:1}
.c.today{color:var(--ink)}
.c.today .dot{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--hot)}
.c.future .dot{opacity:.45}
.sec{display:flex;flex-direction:column}
.sec .t{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec .t h3{font-size:17px}
.sec .t span{font-weight:700;color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0;border:0;background:none;text-align:left}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.tick svg{width:16px;height:16px;opacity:0}
.row[data-done="true"] .tick{background:var(--ink)}
.row[data-done="true"] .tick svg{opacity:1}
.row[data-done="true"] .lbl{color:var(--mute);text-decoration:line-through}
.lbl{font-weight:500;font-size:17px;overflow-wrap:anywhere}
.play{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;min-height:38px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.play svg{width:12px;height:12px}
.empty{padding:16px 0;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;min-height:54px;font-weight:700;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--hot)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* progress */
.lvl{display:flex;flex-direction:column;gap:10px}
.lvl .k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lvl h2{font-size:34px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums div{display:flex;flex-direction:column;gap:2px}
.nums b{font-family:var(--display);font-size:28px}
.nums span{font-size:13px;color:var(--mute);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;font-weight:700;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--ink);min-height:4px}
.bars .z i{background:var(--line)}
.bars .now{color:var(--ink)}
.bars .now i{background:var(--hot)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vs .p{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.vs .p.lead{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.vs .n{font-weight:700;overflow-wrap:anywhere}
.vs .big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.vs .m{font-size:13px;color:var(--mute)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd{display:flex;align-items:center;gap:12px;min-width:0}
.bd .tx{display:flex;flex-direction:column;min-width:0}
.bd b{font-size:14px}
.bd span{font-size:12px;color:var(--mute)}
.bd.off{opacity:.5}
.note{font-size:14px;color:var(--mute)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
label,.lb{font-weight:700;font-size:14px}
input[type=text],input[type=url],select{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
input:focus,select:focus{border-color:var(--ink);outline:none}
.big-in{font-family:var(--display);font-size:26px;min-height:64px;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:none;border-radius:999px;min-height:42px;padding:0 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ed{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ed .r{display:flex;gap:8px;align-items:center}
.ed select{width:auto;min-width:130px;min-height:42px}
.ic{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:none;display:grid;place-items:center;font-weight:700}
.ic[disabled]{opacity:.3}
.ic.x{color:var(--hot)}
/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;gap:22px}
.ob h1{font-size:30px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp .gt{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 0}
.pick{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.pick .top{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 0;width:100%;background:none;border:0;text-align:left}
.pick[data-on="true"] .tick{background:var(--ink)}
.pick[data-on="true"] .tick svg{opacity:1}
.pick .when{display:flex;gap:8px;padding:0 0 12px 42px}
.stick{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);z-index:6}
.stick .in{max-width:540px;margin:0 auto}
/* guided mode */
.guide{position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.guide[hidden]{display:none}
.guide.matin{background:var(--sun);color:var(--sun-ink)}
.guide.soir{background:var(--night);color:var(--night-ink)}
.guide .in{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;flex:1;gap:20px}
.guide .top{display:flex;align-items:center;gap:14px}
.guide .top .seg{flex:1}
.guide .x{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid currentColor;background:none;color:inherit;display:grid;place-items:center}
.guide .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.guide .st{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.guide h2{font-size:34px}
.guide .tip{font-size:17px;max-width:30ch;opacity:.9}
.guide .time{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.guide .acts{display:flex;flex-direction:column;gap:10px}
.guide .acts .r{display:flex;gap:10px}
.guide .acts .r .btn{flex:1}
.guide.matin .btn{background:var(--sun-ink);color:var(--sun)}
.guide.soir .btn{background:var(--night-ink);color:var(--night)}
.guide .btn.line{background:transparent;color:inherit}
.guide a.lnk{color:inherit;font-weight:700;text-align:center;padding:8px}
.guide svg.vis{width:100%;max-width:250px}
.end .bigp{font-family:var(--display);font-weight:700;font-size:72px;line-height:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Navigation" hidden><div class="in" id="tabsIn"></div></nav>
<div class="guide" id="guide" hidden role="dialog" aria-modal="true" aria-label="Mode guidé"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- tiny DOM helpers ---------- */
var SV='http://www.w3.org/2000/svg';
function put(e,kids){ for(var i=0;i<kids.length;i++){ var k=kids[i]; if(k==null||k===false) continue; if(Array.isArray(k)) put(e,k); else e.append(k.nodeType?k:document.createTextNode(String(k))); } }
function mk(ns,t,a,kids){
  var e=ns?document.createElementNS(SV,t):document.createElement(t);
  for(var k in (a||{})){ var v=a[k]; if(v==null||v===false) continue;
    if(k==='class') e.setAttribute('class',v); else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v); }
  put(e,kids); return e;
}
function h(t,a){ return mk(0,t,a,[].slice.call(arguments,2)); }
function s(t,a){ return mk(1,t,a,[].slice.call(arguments,2)); }
function $(q){ return document.querySelector(q); }
function pad(n){ return String(n).padStart(2,'0'); }
function key(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNum(k){ var p=k.split('-').map(Number); return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5); }
function keyOf(n){ var d=new Date(n*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function uid(){ return 't'+Math.random().toString(36).slice(2,8); }
function safeUrl(u){ return typeof u==='string'&&/^https:\/\/[^\s]+$/.test(u)?u:''; }
function plural(n,a,b){ return n+' '+(n>1?b:a); }
function icon(d,cls){ var e=s('svg',{viewBox:'0 0 24 24','aria-hidden':'true',class:cls||null}); e.innerHTML=d; return e; }
var CHECK='<path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
function tickIcon(color){ var e=icon(CHECK); e.style.color=color||'var(--paper)'; return e; }

/* ---------- catalogue ---------- */
var CAT=[
  {k:'dents',g:'Dents',label:'Se brosser les dents',mins:2,slots:['matin','soir'],guide:'brush',tip:'Brosse inclinée à 45° vers la gencive, sans appuyer fort.'},
  {k:'fil',g:'Dents',label:'Fil dentaire',mins:0,slots:['soir'],tip:'Passe le fil entre chaque dent, en formant un C contre la dent.'},
  {k:'elastiques',g:'Dents',label:'Élastiques',mins:0,slots:['matin','soir'],tip:'Mets-les après le brossage, comme prévu par ton orthodontiste.'},
  {k:'gouttieres',g:'Dents',label:'Gouttières',mins:0,slots:['soir','matin'],tip:'Rince-les avant de les mettre. Le matin, retire-les et nettoie-les.'},
  {k:'skin',g:'Peau',label:'Skincare',mins:3,slots:['matin','soir'],tip:'Nettoie, puis hydrate. Prends ton temps sur le visage et le cou.'},
  {k:'spf',g:'Peau',label:'Crème solaire',mins:0,slots:['matin'],tip:'Visage et cou, même quand il fait gris.'},
  {k:'eau',g:'Corps',label:'Verre d’eau',mins:0,slots:['matin'],tip:'Un grand verre avant le café.'},
  {k:'vitamines',g:'Corps',label:'Vitamines',mins:0,slots:['matin'],tip:'Avec le petit-déjeuner, c’est mieux absorbé.'},
  {k:'etirements',g:'Corps',label:'Étirements',mins:5,slots:['matin'],tip:'Nuque, dos, jambes. Respire lentement.'},
  {k:'respirer',g:'Corps',label:'Respirer',mins:5,slots:['matin','soir'],tip:'Inspire 4 secondes, expire 6 secondes. Rien d’autre à faire.'},
  {k:'lit',g:'Maison',label:'Faire son lit',mins:0,slots:['matin'],tip:'Deux minutes qui changent le reste de la journée.'},
  {k:'sac',g:'Maison',label:'Préparer son sac',mins:0,slots:['soir'],tip:'Cours, clés, chargeur. Tout à la porte.'},
  {k:'lire',g:'Maison',label:'Lire',mins:10,slots:['soir'],tip:'Un vrai livre, téléphone dans une autre pièce.'},
  {k:'tel',g:'Maison',label:'Poser le téléphone',mins:0,slots:['soir'],tip:'Branche-le loin du lit.'}
];
var ORD={
  matin:['gouttieres','eau','lit','etirements','respirer','skin','spf','dents','elastiques','vitamines'],
  soir:['sac','lire','respirer','skin','fil','dents','gouttieres','elastiques','tel']
};
function cat(k){ return CAT.filter(function(c){return c.k===k;})[0]; }
function taskFrom(c,slot){ return {id:uid(),key:c.k,label:c.label,slot:slot,mins:c.mins,tip:c.tip||'',guide:c.guide||''}; }
function sortTasks(){
  S.tasks.sort(function(a,b){
    if(a.slot!==b.slot) return a.slot==='matin'?-1:1;
    return 0;
  });
}

/* ---------- state ---------- */
var KEY='rituel-v1';
var S=null, tab='today', guide=null, TM=null, pendingRival=null;
var onb={step:0,name:'',picks:{}};
var resetArmed=false;
function load(){
  try{ var r=localStorage.getItem(KEY); if(r){ S=JSON.parse(r); S.tasks=S.tasks||[]; S.days=S.days||{}; S.brush=S.brush||{}; S.seen=S.seen||[]; S.rival=S.rival||null; } }catch(e){ S=null; }
}
function prune(){
  var min=dayNum(key())-150;
  ['days','brush'].forEach(function(f){ Object.keys(S[f]||{}).forEach(function(k){ if(dayNum(k)<min) delete S[f][k]; }); });
}
function save(){ if(!S) return; try{ prune(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove('on');},3000); }

/* ---------- scoring ---------- */
function ptsDay(d){ return (d.done||[]).length*10+(d.full?20:0); }
function wsNum(n){ var wd=new Date(n*864e5).getUTCDay(); return n-((wd+6)%7); }
function stats(p){
  var days=p.days||{}, br=p.brush||{}, today=dayNum(key()), total=0, tasks=0, fullN=[], k;
  for(k in days){ var d=days[k]; tasks+=(d.done||[]).length; total+=ptsDay(d); if(d.full) fullN.push(dayNum(k)); }
  var brushes=0; for(k in br){ brushes+=br[k]; total+=br[k]*5; }
  fullN.sort(function(a,b){return a-b;});
  var best=0,run=0,prev=null; fullN.forEach(function(n){ run=(prev!=null&&n===prev+1)?run+1:1; if(run>best) best=run; prev=n; });
  var set={}; fullN.forEach(function(n){set[n]=1;});
  var cur=0,c=today; if(!set[c]) c--; while(set[c]){cur++;c--;}
  var ws=wsNum(today), week=0, perDay=[];
  for(var i=0;i<7;i++){ var kk=keyOf(ws+i), v=(days[kk]?ptsDay(days[kk]):0)+(br[kk]||0)*5; perDay.push(v); week+=v; }
  var td=days[key()]||{done:[]};
  return {total:total,tasks:tasks,fullDays:fullN.length,best:best,cur:cur,week:week,perDay:perDay,brushes:brushes,todayDone:td.done.length};
}
var BADGES=[
  {id:'b1',name:'Premier pas',desc:'Une première étape faite',goal:1,val:function(x){return x.tasks;}},
  {id:'b2',name:'Journée pleine',desc:'Toutes tes étapes du jour',goal:1,val:function(x){return x.fullDays;}},
  {id:'b3',name:'Trois d’affilée',desc:'3 jours pleins de suite',goal:3,val:function(x){return x.best;}},
  {id:'b4',name:'Semaine parfaite',desc:'7 jours pleins de suite',goal:7,val:function(x){return x.best;}},
  {id:'b5',name:'Deux semaines',desc:'14 jours pleins de suite',goal:14,val:function(x){return x.best;}},
  {id:'b6',name:'Un mois',desc:'30 jours pleins de suite',goal:30,val:function(x){return x.best;}},
  {id:'b7',name:'Sourire éclatant',desc:'10 brossages chronométrés',goal:10,val:function(x){return x.brushes;}},
  {id:'b8',name:'500 points',desc:'Cumule 500 points',goal:500,val:function(x){return x.total;}}
];
function earned(st){ return BADGES.filter(function(b){return b.val(st)>=b.goal;}); }
function checkBadges(){
  var ids=earned(stats(S)).map(function(b){return b.id;});
  var fresh=ids.filter(function(i){return S.seen.indexOf(i)<0;});
  if(!fresh.length) return;
  S.seen=ids;
  var names=fresh.map(function(i){return BADGES.filter(function(b){return b.id===i;})[0].name;});
  if(guide) guide.fresh=(guide.fresh||[]).concat(names); else toast('Nouveau badge : '+names.join(', '));
}
var TITLES=['Endormi','Réveillé','Régulier','Discipliné','Machine','Légende'];
function level(total){ var l=Math.floor(Math.sqrt(total/40))+1; return {n:l,title:TITLES[Math.min(l-1,TITLES.length-1)],from:40*(l-1)*(l-1),to:40*l*l}; }

/* ---------- actions ---------- */
function dayRec(create){ var k=key(); if(!S.days[k]&&create) S.days[k]={done:[],full:false}; return S.days[k]; }
function doneIds(){ var d=S.days[key()]; return d?d.done:[]; }
function setDone(id,val){
  var d=dayRec(true), was=d.full, i=d.done.indexOf(id);
  if(val&&i<0) d.done.push(id);

  function block(sl,title){
    var list=slotTasks(sl);
    var addIn=h('input',{type:'text',placeholder:'Autre chose…',maxlength:50,'aria-label':'Ajouter une étape personnalisée, '+title,autocomplete:'off'});
    function addCustom(){ var v=addIn.value.trim(); if(v&&addTask({k:'custom',label:v,mins:0,tip:''},sl)) addIn.value=''; }
    addIn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addCustom(); } });
    var missing=CAT.filter(function(c){ return !list.some(function(t){return t.key===c.k;}); });
    return h('section',{class:'sec'},
      h('div',{class:'t'},h('h3',null,title),h('span',null,plural(list.length,'étape','étapes'))),
      list.length?list.map(function(t,i){
        var lab=h('input',{type:'text',value:t.label,maxlength:50,'aria-label':'Nom de l’étape',autocomplete:'off'});
        lab.addEventListener('change',function(){ var v=lab.value.trim(); if(v){ t.label=v.slice(0,50); save(); } else lab.value=t.label; });
        var sel=h('select',{'aria-label':'Minuteur pour '+t.label},MINS.map(function(m){ return h('option',{value:m,selected:m===t.mins?true:null},m?m+' min':'Sans minuteur'); }));
        sel.addEventListener('change',function(){ t.mins=Number(sel.value); save(); });
        return h('div',{class:'ed'},
          h('div',{class:'r'},lab,h('button',{class:'ic x',type:'button','aria-label':'Retirer '+t.label,onclick:function(){removeTask(t.id);}},icon('<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>'))),
          h('div',{class:'r'},sel,h('span',{style:'flex:1'}),
            h('button',{class:'ic',type:'button','aria-label':'Monter '+t.label,disabled:i===0?true:null,onclick:function(){move(t.id,-1);}},icon('<path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>')),
            h('button',{class:'ic',type:'button','aria-label':'Descendre '+t.label,disabled:i===list.length-1?true:null,onclick:function(){move(t.id,1);}},icon('<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>')))
        );
      }):h('p',{class:'empty'},'Aucune étape. Ajoute-en ci-dessous.'),
      h('div',{class:'field',style:'margin-top:14px'},
        h('div',{class:'lb'},'Ajouter'),
        h('div',{class:'chips'},missing.map(function(c){ return h('button',{class:'chip',type:'button',onclick:function(){addTask(c,sl);}},'+ '+c.label); })),
        h('div',{style:'display:flex;gap:8px'},addIn,h('button',{class:'btn sm',type:'button',onclick:addCustom},'Ajouter')))
    );
  }
  return [
    h('header',{class:'hdr'},h('div',null,h('div',{class:'d'},'Tout se change ici'),h('h1',null,'Réglages'))),
    h('div',{class:'field'},h('label',{for:'s-name'},'Prénom'),nameIn),
    block('matin','Matin'),block('soir','Soir'),
    h('div',{class:'field'},h('label',{for:'s-pl'},'Ta playlist'),pl,h('p',{class:'note'},'Le site ouvre ta playlist dans Spotify pendant les étapes guidées. Il ne peut pas piloter la lecture lui-même.')),
    h('section',{class:'field'},
      h('button',{class:'btn line sm',type:'button',style:'align-self:flex-start;color:var(--ink)',onclick:function(){
        if(!resetArmed){ resetArmed=true; render(); return; }
        resetArmed=false; S=null; try{ localStorage.removeItem(KEY); }catch(e){} onb={step:0,name:'',picks:{}}; tab='today'; render();
      }},resetArmed?'Confirmer : tout effacer':'Tout effacer'),
      resetArmed?h('p',{class:'note'},'Ta progression et tes étapes seront supprimées sur cet appareil.'):null)
  ];
}

function viewOnboard(){
  if(onb.step===0){
    var nameIn=h('input',{type:'text',class:'big-in',id:'o-name',value:onb.name,placeholder:'Ton prénom',maxlength:24,autocomplete:'off','aria-label':'Ton prénom'});
    nameIn.addEventListener('input',function(){ onb.name=nameIn.value; });
    function go(){ if(!onb.name.trim()){ toast('Entre ton prénom'); nameIn.focus(); return; } onb.step=1; render(); window.scrollTo(0,0); }
    nameIn.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    return h('div',{class:'ob'},
      h('div',{style:'height:8vh'}),
      h('div',{class:'d',style:'font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)'},'Rituel'),
      h('h1',null,'Une routine qui te guide, étape par étape.'),
      h('p',{class:'note'},'Comment tu t’appelles ?'),nameIn,
      h('button',{class:'btn block',type:'button',onclick:go},'Continuer'));
  }
  var n=0; Object.keys(onb.picks).forEach(function(k){ var p=onb.picks[k]; if(p.matin||p.soir) n++; });
  var groups=['Dents','Peau','Corps','Maison'];
  function pick(c){
    var p=onb.picks[c.k]||{matin:false,soir:false}, on=p.matin||p.soir;
    return h('div',{class:'pick','data-on':on?'true':'false'},
      h('button',{class:'top',type:'button','aria-pressed':on?'true':'false',onclick:function(){
        if(on) onb.picks[c.k]={matin:false,soir:false};
        else { var o={matin:false,soir:false}; o[c.slots[0]]=true; if(c.k==='dents'){o.matin=true;o.soir=true;} onb.picks[c.k]=o; }
        var y=window.scrollY; render(); window.scrollTo(0,y);
      }},h('span',{class:'tick'},tickIcon()),h('span',{class:'lbl'},c.label),c.mins?h('span',{class:'note',style:'margin-left:auto'},c.mins+' min'):null),
      on?h('div',{class:'when'},['matin','soir'].map(function(sl){
        return h('button',{class:'chip',type:'button','aria-pressed':p[sl]?'true':'false',onclick:function(){
          var q=onb.picks[c.k]; q[sl]=!q[sl]; var y=window.scrollY; render(); window.scrollTo(0,y);
        }},sl==='matin'?'Matin':'Soir');
      })):null);
  }
  return h('div',{class:'ob'},
    h('div',null,h('h1',null,'Qu’est-ce que tu veux suivre ?'),h('p',{class:'note',style:'margin-top:10px'},'Coche ce qui compte pour toi. Tu pourras tout changer dans Réglages.')),
    groups.map(function(g){ return h('div',{class:'grp'},h('div',{class:'gt'},g),CAT.filter(function(c){return c.g===g;}).map(pick)); }),
    h('div',{style:'height:70px'}),
    h('div',{class:'stick'},h('div',{class:'in'},h('button',{class:'btn block',type:'button',disabled:n?null:true,onclick:function(){
      S={name:onb.name.trim().slice(0,24),playlist:'',tasks:[],days:{},brush:{},seen:[],rival:null};
      ['matin','soir'].forEach(function(sl){
        ORD[sl].forEach(function(k){ var p=onb.picks[k]; if(p&&p[sl]) S.tasks.push(taskFrom(cat(k),sl)); });
      });
      if(pendingRival){ S.rival=pendingRival; pendingRival=null; tab='progress'; }
      save(); render(); window.scrollTo(0,0);
    }},n?'Commencer avec '+plural(n,'élément','éléments'):'Choisis au moins un élément')))
  );
}

/* ---------- render ---------- */
var TABS=[
  {id:'today',label:'Aujourd’hui',ic:'<path d="M4 12.5l5 5L20 6.5"/>'},
  {id:'progress',label:'Progrès',ic:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:'settings',label:'Réglages',ic:'<path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="8" cy="17" r="1.6"/>'}
];
function render(){
  var app=$('#app');
  app.textContent='';
  var tabs=$('#tabs');
  if(!S){ tabs.hidden=true; put(app,[viewOnboard()]); return; }
  tabs.hidden=false;
  var box=$('#tabsIn'); box.textContent='';
  TABS.forEach(function(t){
    var ic=s('svg',{viewBox:'0 0 24 24','aria-hidden':'true'}); ic.innerHTML=t.ic;
    box.appendChild(h('button',{class:'tab',type:'button','aria-current':tab===t.id?'page':null,onclick:function(){ tab=t.id; resetArmed=false; render(); window.scrollTo(0,0); }},ic,t.label));
  });
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',period()==='matin'?'#FFD23F':'#242B63');
  put(app,tab==='progress'?viewProgress():tab==='settings'?viewSettings():viewToday());
}

/* ---------- boot ---------- */
load();
var incoming=takeHash();
if(incoming){
  if(S){ S.rival=incoming; tab='progress'; save(); setTimeout(function(){ toast('Duel lancé avec '+incoming.n); },300); }
  else pendingRival=incoming;
}
render();
})();
</script>
</body>
</html>
