<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routine Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, cards on a tinted ground, tab bar fixed at the bottom. Palette: toothpaste mint, ink blue, coral for the rival. */
:root{
  --bg:#EEF5F3; --surface:#FFFFFF; --ink:#0F2E38; --muted:#58737C; --line:#D5E3E0;
  --accent:#0B8A7E; --on-accent:#FFFFFF; --accent-soft:#D6F0EB;
  --warm:#E5573A; --warm-soft:#FDE4DD; --gold:#C98A00;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B20; --surface:#14282F; --ink:#E6F1EF; --muted:#8FAAB2; --line:#26424B;
    --accent:#3CC5B5; --on-accent:#06211F; --accent-soft:#143A3A;
    --warm:#FF8A6E; --warm-soft:#3A2420; --gold:#F0B93A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B20; --surface:#14282F; --ink:#E6F1EF; --muted:#8FAAB2; --line:#26424B;
  --accent:#3CC5B5; --on-accent:#06211F; --accent-soft:#143A3A;
  --warm:#FF8A6E; --warm-soft:#3A2420; --gold:#F0B93A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.app{max-width:560px;margin:0 auto;padding:20px 16px 104px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .date{color:var(--muted);font-size:14px;text-transform:capitalize}
.top h1{font-size:28px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:20px}
.sub{color:var(--muted);font-size:14px;margin:0}
.hero{display:flex;align-items:center;gap:16px}
.hero .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring-n{font-family:var(--display);font-weight:700}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.task:hover{border-color:var(--accent)}
.task:focus-visible,.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.task .box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.task .box svg{opacity:0;transform:scale(.6);transition:all .15s}
.task[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.task[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.task[aria-pressed="true"] .box svg{opacity:1;transform:none}
.task[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--muted)}
.task .lbl{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.task .pts{flex:none;font-size:13px;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--warm);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.grow>*{flex:1}
input[type=text],input[type=url],select{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
label{font-weight:700;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;border-radius:12px;min-height:52px;padding:6px 4px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.duel{display:flex;flex-direction:column;gap:14px}
.who{display:flex;flex-direction:column;gap:8px}
.who .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.who .name{font-family:var(--display);font-weight:700;font-size:20px;overflow-wrap:anywhere}
.who .score{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.who.rival .bar i{background:var(--warm)}
.who .meta{display:flex;gap:8px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:14px;min-width:0}
.badge.on{border-color:var(--gold);background:var(--surface)}
.badge .t{display:flex;flex-direction:column;min-width:0}
.badge .t b{font-size:14px;overflow-wrap:anywhere}
.badge .t span{font-size:12px;color:var(--muted)}
.badge.off{opacity:.65}
.mouth{display:grid;place-items:center}
.timer-big{font-family:var(--display);font-weight:700;font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--warm);transform:scale(1.25)}
.centered{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border:1.5px solid var(--line);border-radius:12px}
.item span{flex:1;min-width:0;overflow-wrap:anywhere}
.notice{background:var(--warm-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <div class="date" id="date"></div>
      <h1 id="hello">Routine Duo</h1>
    </div>
    <div id="streakPill"></div>
  </header>
  <div id="notice"></div>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Navigation">
  <div class="in" id="tabs"></div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var SVGNS='http://www.w3.org/2000/svg';
function put(e,kids){
  (function walk(list){
    for(var i=0;i<list.length;i++){
      var k=list[i];
      if(k==null||k===false) continue;
      if(Array.isArray(k)) walk(k);
      else if(k.nodeType) e.appendChild(k);
      else e.appendChild(document.createTextNode(String(k)));
    }
  })(kids);
}
function make(ns,tag,attrs,kids){
  var e=ns?document.createElementNS(SVGNS,tag):document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.setAttribute('class',v);
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  put(e,kids);
  return e;
}
function h(tag,attrs){ return make(false,tag,attrs,Array.prototype.slice.call(arguments,2)); }
function s(tag,attrs){ return make(true,tag,attrs,Array.prototype.slice.call(arguments,2)); }
function $(sel){ return document.querySelector(sel); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNum(k){ var p=k.split('-').map(Number); return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5); }
function keyFromNum(n){ var d=new Date(n*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function uid(){ return 't'+Math.random().toString(36).slice(2,8); }
function safeUrl(u){ return typeof u==='string' && /^https:\/\/[^\s]+$/.test(u) ? u : ''; }

/* ---------- state ---------- */
var db=null, myId=null, local=false, loaded=false, slow=false;
var people={}, mine=null;
var saving=false, dirty=false;
var tab='aujourdhui';
var TABS=[
  {id:'aujourdhui',label:'Aujourd’hui',icon:'<path d="M4 12.5l5 5L20 6.5"/>'},
  {id:'duel',label:'Duel',icon:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M12 14v4M8 20h8"/>'},
  {id:'brossage',label:'Brossage',icon:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M10 3h4"/>'},
  {id:'reglages',label:'Réglages',icon:'<path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="8" cy="17" r="1.6"/>'}
];
var SUGGEST=[
  {label:'Skincare',slot:'matin',on:true},
  {label:'Se brosser les dents',slot:'matin',on:true},
  {label:'Boire un verre d’eau',slot:'matin',on:false},
  {label:'Élastiques',slot:'matin',on:false},
  {label:'Gouttières',slot:'matin',on:false},
  {label:'Vitamines',slot:'matin',on:false},
  {label:'Skincare',slot:'soir',on:true},
  {label:'Se brosser les dents',slot:'soir',on:true},
  {label:'Fil dentaire',slot:'soir',on:false},
  {label:'Élastiques',slot:'soir',on:false},
  {label:'Gouttières',slot:'soir',on:false},
  {label:'Préparer mon sac',slot:'soir',on:false}
];
var onboard={name:'',picks:SUGGEST.map(function(x){return {label:x.label,slot:x.slot,on:x.on};})};

/* ---------- scoring ---------- */
function ptsOfDay(d){ return (d.done||[]).length*10+(d.full?20:0); }
function weekStartNum(todayNum){ var wd=new Date(todayNum*864e5).getUTCDay(); return todayNum-((wd+6)%7); }
function stats(p){
  var days=p.days||{}, brush=p.brush||{};
  var today=dayNum(keyOf());
  var total=0, tasksDone=0, fullDays=0, fullNums=[], k;
  for(k in days){
    var d=days[k], n=(d.done||[]).length;
    tasksDone+=n; total+=ptsOfDay(d);
    if(d.full){ fullDays++; fullNums.push(dayNum(k)); }
  }
  var brushes=0;
  for(k in brush){ brushes+=brush[k]; total+=brush[k]*5; }
  fullNums.sort(function(a,b){return a-b;});
  var best=0, run=0, prev=null;
  fullNums.forEach(function(n){ run=(prev!=null&&n===prev+1)?run+1:1; if(run>best) best=run; prev=n; });
  var set={}; fullNums.forEach(function(n){set[n]=1;});
  var cur=0, c=today; if(!set[c]) c--;
  while(set[c]){ cur++; c--; }
  var ws=weekStartNum(today), week=0;
  for(var i=0;i<7;i++){
    var kk=keyFromNum(ws+i);
    if(days[kk]) week+=ptsOfDay(days[kk]);
    if(brush[kk]) week+=brush[kk]*5;
  }
  var td=days[keyOf()]||{done:[]};
  return {total:total,tasksDone:tasksDone,fullDays:fullDays,best:best,cur:cur,week:week,brushes:brushes,todayDone:td.done.length,todayFull:!!td.full};
}
var BADGES=[
  {name:'Premier pas',desc:'Coche ta première tâche',goal:1,val:function(x){return x.tasksDone;}},
  {name:'Journée pleine',desc:'Finis toutes tes tâches du jour',goal:1,val:function(x){return x.fullDays;}},
  {name:'Trois d’affilée',desc:'3 jours complets de suite',goal:3,val:function(x){return x.best;}},
  {name:'Semaine parfaite',desc:'7 jours complets de suite',goal:7,val:function(x){return x.best;}},
  {name:'Deux semaines',desc:'14 jours complets de suite',goal:14,val:function(x){return x.best;}},
  {name:'Un mois',desc:'30 jours complets de suite',goal:30,val:function(x){return x.best;}},
  {name:'Sourire éclatant',desc:'10 brossages chronométrés',goal:10,val:function(x){return x.brushes;}},
  {name:'500 points',desc:'Cumule 500 points',goal:500,val:function(x){return x.total;}}
];

/* ---------- persistence ---------- */
function prune(p){
  var min=dayNum(keyOf())-120;
  ['days','brush'].forEach(function(f){
    var o=p[f]||{};
    Object.keys(o).forEach(function(k){ if(dayNum(k)<min) delete o[k]; });
  });
}
function save(){
  if(local){ try{ localStorage.setItem('routine-duo',JSON.stringify(mine)); }catch(e){} return; }
  if(!db||!myId||!mine) return;
  dirty=true;
  if(saving) return;
  saving=true;
  (async function(){
    try{
      while(dirty){
        dirty=false;
        prune(mine);
        await db.doc('people/'+myId).set(clone(mine));
      }
    }catch(e){
      toast('Enregistrement impossible. Vérifie que tu es connecté et invité comme contributeur.');
    }finally{ saving=false; }
  })();
}
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t=setTimeout(function(){t.classList.remove('on');},3200);
}

/* ---------- actions ---------- */
function slotNow(){ return new Date().getHours()<15?'matin':'soir'; }
function dayRec(create){
  var k=keyOf(); mine.days=mine.days||{};
  if(!mine.days[k]&&create) mine.days[k]={done:[],full:false};
  return mine.days[k];
}
function setDone(id,val){
  var d=dayRec(true), was=d.full, i=d.done.indexOf(id);
  if(val&&i<0) d.done.push(id);
  if(!val&&i>=0) d.done.splice(i,1);
  d.full=mine.tasks.length>0&&mine.tasks.every(function(t){return d.done.indexOf(t.id)>=0;});
  if(!d.done.length) delete mine.days[keyOf()];
  save(); render();
  if(!was&&d.full) toast('Journée complète ! +20 points bonus');
}
function addTask(label,slot){
  label=(label||'').trim().slice(0,60);
  if(!label) return false;
  if(mine.tasks.some(function(t){return t.label.toLowerCase()===label.toLowerCase()&&t.slot===slot;})){ toast('Cette tâche existe déjà'); return false; }
  mine.tasks.push({id:uid(),label:label,slot:slot});
  save(); render(true); return true;
}
function removeTask(id){
  mine.tasks=mine.tasks.filter(function(t){return t.id!==id;});
  var d=dayRec(false);
  if(d){ d.full=mine.tasks.length>0&&mine.tasks.every(function(t){return d.done.indexOf(t.id)>=0;}); }
  save(); render(true);
}

/* ---------- pieces ---------- */
function ring(done,total,size){
  var r=size/2-9, c=2*Math.PI*r, f=total?done/total:0;
  return s('svg',{width:size,height:size,viewBox:'0 0 '+size+' '+size,role:'img','aria-label':done+' tâches sur '+total},
    s('circle',{cx:size/2,cy:size/2,r:r,fill:'none',stroke:'var(--line)','stroke-width':10}),
    s('circle',{cx:size/2,cy:size/2,r:r,fill:'none',stroke:'var(--accent)','stroke-width':10,'stroke-linecap':'round','stroke-dasharray':(c*f)+' '+c,transform:'rotate(-90 '+size/2+' '+size/2+')'}),
    s('text',{x:size/2,y:size/2+8,'text-anchor':'middle',class:'ring-n',fill:'var(--ink)','font-size':size/3.4,'font-family':'var(--display)','font-weight':700},done+'/'+total)
  );
}
function medal(on,txt){
  return s('svg',{width:44,height:44,viewBox:'0 0 44 44','aria-hidden':'true'},
    s('path',{d:'M14 3h6l2 9h-6zM30 3h-6l-2 9h6z',fill:on?'var(--warm)':'var(--line)'}),
    s('circle',{cx:22,cy:27,r:14,fill:on?'var(--gold)':'none',stroke:on?'var(--gold)':'var(--muted)','stroke-width':2}),
    s('text',{x:22,y:32,'text-anchor':'middle','font-size':txt.length>2?11:14,'font-weight':700,'font-family':'var(--display)',fill:on?'#fff':'var(--muted)'},txt)
  );
}
function checkSvg(){
  return s('svg',{width:16,height:16,viewBox:'0 0 16 16','aria-hidden':'true'},s('path',{d:'M3 8.5l3.2 3.2L13 5',fill:'none',stroke:'var(--on-accent)','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'}));
}
function badgeGrid(st){
  return h('div',{class:'badges'},BADGES.map(function(b){
    var v=b.val(st), on=v>=b.goal;
    return h('div',{class:'badge '+(on?'on':'off')},
      medal(on,String(b.goal)),
      h('div',{class:'t'},h('b',null,b.name),h('span',null,on?'Obtenu':Math.min(v,b.goal)+' / '+b.goal+' · '+b.desc))
    );
  }));
}

/* ---------- views ---------- */
function viewToday(){
  var st=stats(mine), d=dayRec(false)||{done:[]};
  var total=mine.tasks.length, done=mine.tasks.filter(function(t){return d.done.indexOf(t.id)>=0;}).length;
  function section(slot,title){
    var list=mine.tasks.filter(function(t){return t.slot===slot;});
    return h('section',{class:'card'},
      h('h2',null,title),
      list.length?h('div',{class:'tasks'},list.map(function(t){
        var on=d.done.indexOf(t.id)>=0;
        return h('button',{class:'task',type:'button','aria-pressed':on?'true':'false',onclick:function(){setDone(t.id,!on);}},
          h('span',{class:'box'},checkSvg()),
          h('span',{class:'lbl'},t.label),
          h('span',{class:'pts'},'+10')
        );
      })):h('p',{class:'sub'},'Rien ici pour l’instant. Ajoute des tâches dans Réglages.')
    );
  }
  var msg = total===0 ? 'Ajoute tes premières tâches dans Réglages.'
    : done===total ? 'Journée complète, bravo.'
    : done===0 ? 'Rien de coché pour l’instant. Commence par la première.'
    : (total-done)+' à faire pour finir la journée (+20 points bonus).';
  return [
    h('div',{class:'card hero'},
      ring(done,total,112),
      h('div',{class:'txt'},
        h('h2',null,'Ton avancée du jour'),
        h('p',{class:'sub'},msg),
        h('div',{class:'row'},h('span',{class:'pill'},st.week+' pts cette semaine'))
      )
    ),
    section('matin','Matin'),
    section('soir','Soir')
  ];
}

function viewDuel(){
  var all={}; Object.keys(people).forEach(function(k){all[k]=people[k];});
  if(mine&&myId) all[myId]=mine;
  var ids=Object.keys(all);
  var rows=ids.map(function(id){ return {id:id,p:all[id],st:stats(all[id])}; });
  rows.sort(function(a,b){return b.st.week-a.st.week;});
  var max=Math.max.apply(null,rows.map(function(r){return r.st.week;}).concat([1]));
  var today=dayNum(keyOf()), ws=weekStartNum(today), left=ws+6-today;
  var headline='Invite ta copine pour lancer le duel.';
  if(rows.length>1){
    var gap=rows[0].st.week-rows[1].st.week;
    var leadName=rows[0].id===myId?'Tu mènes':(rows[0].p.name||'Quelqu’un')+' mène';
    headline=gap===0?'Égalité parfaite cette semaine.':leadName+' de '+gap+' point'+(gap>1?'s':'')+'.';
  }
  var cards=rows.map(function(r,i){
    var me=r.id===myId;
    return h('div',{class:'who '+(me?'':'rival')},
      h('div',{class:'head'},
        h('span',{class:'name'},(r.p.name||'Quelqu’un')+(me?' (toi)':'')),
        h('span',{class:'score'},r.st.week)
      ),
      h('div',{class:'bar',role:'img','aria-label':r.st.week+' points'},h('i',{style:'width:'+Math.round(r.st.week/max*100)+'%'})),
      h('div',{class:'meta'},
        i===0&&rows.length>1&&r.st.week>0?h('span',{class:'pill'},'En tête'):null,
        h('span',{class:'pill'+(me?'':' warm')},'Série '+r.st.cur+' j'),
        h('span',{class:'pill'+(me?'':' warm')},r.st.todayDone+' tâche'+(r.st.todayDone>1?'s':'')+' aujourd’hui'),
        h('span',{class:'pill'+(me?'':' warm')},BADGES.filter(function(b){return b.val(r.st)>=b.goal;}).length+' badges')
      )
    );
  });
  var mySt=stats(mine);
  return [
    h('section',{class:'card'},
      h('h2',null,'Duel de la semaine'),
      h('p',{class:'sub'},headline+' Fin du duel dans '+(left===0?'moins d’un jour':left+' jour'+(left>1?'s':''))+' (dimanche soir). Points : 10 par tâche, 20 pour une journée complète, 5 par brossage chronométré.'),
      h('div',{class:'duel'},cards)
    ),
    h('section',{class:'card'},
      h('h2',null,'Tes badges'),
      h('p',{class:'sub'},mySt.total+' points au total · meilleure série '+mySt.best+' jour'+(mySt.best>1?'s':'')),
      badgeGrid(mySt)
    )
  ];
}

/* ----- brushing timer ----- */
var STEP_MS=15000, STEPS=[
  {q:0,ring:'out',t:'En haut à gauche',d:'Face extérieure : petits cercles vers la gencive'},
  {q:0,ring:'in',t:'En haut à gauche',d:'Face intérieure et dessus : d’arrière en avant'},
  {q:1,ring:'out',t:'En haut à droite',d:'Face extérieure : petits cercles vers la gencive'},
  {q:1,ring:'in',t:'En haut à droite',d:'Face intérieure et dessus : d’arrière en avant'},
  {q:2,ring:'out',t:'En bas à droite',d:'Face extérieure : petits cercles vers la gencive'},
  {q:2,ring:'in',t:'En bas à droite',d:'Face intérieure et dessus : d’arrière en avant'},
  {q:3,ring:'out',t:'En bas à gauche',d:'Face extérieure : petits cercles vers la gencive'},
  {q:3,ring:'in',t:'En bas à gauche',d:'Face intérieure et dessus : d’arrière en avant'}
];
var QANG=[[180,270],[270,360],[0,90],[90,180]];
var T={running:false,startAt:0,base:0,done:false,step:-1,iv:null,audio:null,lock:null,refs:null,gained:0};
function polar(cx,cy,r,a){ var t=a*Math.PI/180; return [cx+r*Math.cos(t),cy+r*Math.sin(t)]; }
function sector(cx,cy,r1,r2,a1,a2){
  var p1=polar(cx,cy,r2,a1),p2=polar(cx,cy,r2,a2),p3=polar(cx,cy,r1,a2),p4=polar(cx,cy,r1,a1);
  return 'M'+p1[0]+' '+p1[1]+'A'+r2+' '+r2+' 0 0 1 '+p2[0]+' '+p2[1]+'L'+p3[0]+' '+p3[1]+'A'+r1+' '+r1+' 0 0 0 '+p4[0]+' '+p4[1]+'Z';
}
function elapsed(){ return T.running?T.base+(Date.now()-T.startAt):T.base; }
function beep(f,ms){
  try{
    if(!T.audio) return;
    var o=T.audio.createOscillator(), g=T.audio.createGain();
    o.frequency.value=f; o.connect(g); g.connect(T.audio.destination);
    g.gain.setValueAtTime(0.0001,T.audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,T.audio.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,T.audio.currentTime+ms/1000);
    o.start(); o.stop(T.audio.currentTime+ms/1000+0.05);
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function mmss(ms){ var t=Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+':'+pad(t%60); }
function startBrush(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC&&!T.audio) T.audio=new AC(); if(T.audio&&T.audio.state==='suspended') T.audio.resume(); }catch(e){}
  try{ if(navigator.wakeLock&&navigator.wakeLock.request) navigator.wakeLock.request('screen').then(function(l){T.lock=l;}).catch(function(){}); }catch(e){}
  if(T.done){ T.done=false; T.base=0; T.step=-1; }
  T.running=true; T.startAt=Date.now();
  beep(660,180); buzz(60);
  clearInterval(T.iv); T.iv=setInterval(tick,100);
  render(true);
}
function pauseBrush(){
  T.base=elapsed(); T.running=false; clearInterval(T.iv);
  try{ if(T.lock) T.lock.release(); }catch(e){}
  render(true);
}
function resetBrush(){
  T.running=false; T.base=0; T.done=false; T.step=-1; clearInterval(T.iv);
  try{ if(T.lock) T.lock.release(); }catch(e){}
  render(true);
}
function finishBrush(){
  T.running=false; T.base=0; T.done=true; T.step=-1; clearInterval(T.iv);
  try{ if(T.lock) T.lock.release(); }catch(e){}
  beep(880,200); setTimeout(function(){beep(1175,350);},230); buzz([120,80,120]);
  var k=keyOf(); mine.brush=mine.brush||{}; mine.brush[k]=(mine.brush[k]||0)+1;
  var slot=slotNow();
  var t=mine.tasks.filter(function(x){return x.slot===slot&&/dent|brosse/i.test(x.label);})[0];
  T.gained=5;
  if(t){
    var d=dayRec(false);
    if(!d||d.done.indexOf(t.id)<0){ T.gained+=10; setDone(t.id,true); T.auto=t.label; }
    else { T.auto=''; save(); }
  } else { T.auto=''; save(); }
  render(true);
}
function tick(){
  var e=elapsed();
  if(e>=STEPS.length*STEP_MS){ finishBrush(); return; }
  var st=Math.floor(e/STEP_MS);
  if(st!==T.step){
    if(T.step>=0){ beep(740,160); buzz(80); }
    T.step=st; paintStep(st);
  }
  if(T.refs){
    T.refs.time.textContent=mmss(STEPS.length*STEP_MS-e);
    T.refs.sec.textContent=Math.ceil((STEP_MS-(e%STEP_MS))/1000)+' s';
  }
}
function paintStep(st){
  if(!T.refs) return;
  var cur=STEPS[st];
  T.refs.sectors.forEach(function(p,i){
    var on=i===st;
    p.setAttribute('fill',on?'var(--accent)':(STEPS[i].q===cur.q?'var(--accent-soft)':'var(--bg)'));
  });
  T.refs.where.textContent=cur.t;
  T.refs.what.textContent=cur.d;
  T.refs.dots.forEach(function(dot,i){ dot.setAttribute('class',i<st?'on':(i===st?'now':'')); });
}
function viewBrush(){
  var url=safeUrl(mine.playlist);
  var refs={sectors:[],dots:[]};
  var svg=s('svg',{viewBox:'0 0 200 200',width:'100%',style:'max-width:260px',role:'img','aria-label':'Schéma de la bouche en quatre zones'});
  STEPS.forEach(function(stp,i){
    var a=QANG[stp.q], r=stp.ring==='out'?[60,94]:[24,56];
    var p=s('path',{d:sector(100,100,r[0],r[1],a[0]+2,a[1]-2),fill:'var(--bg)',stroke:'var(--line)','stroke-width':1.5});
    refs.sectors.push(p); svg.appendChild(p);
  });
  var big=h('div',{class:'timer-big'},mmss(STEPS.length*STEP_MS-elapsed()));
  var sec=h('span',{class:'pill'},'15 s');
  var where=h('h2',null,'Prêt ?');
  var what=h('p',{class:'sub'},'2 minutes, 8 étapes de 15 secondes. Brosse incliné à 45° vers la gencive, sans appuyer fort.');
  var dots=h('div',{class:'steps','aria-hidden':'true'},STEPS.map(function(_,i){var d=h('i');refs.dots.push(d);return d;}));
  refs.time=big; refs.sec=sec; refs.where=where; refs.what=what;
  T.refs=refs;
  var started=T.running||T.base>0;
  var controls;
  if(T.running) controls=h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:pauseBrush},'Pause'),h('button',{class:'btn ghost',type:'button',onclick:resetBrush},'Recommencer'));
  else if(started) controls=h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:startBrush},'Reprendre'),h('button',{class:'btn ghost',type:'button',onclick:resetBrush},'Recommencer'));
  else controls=h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:startBrush},T.done?'Refaire un brossage':'Démarrer le brossage'));
  var out=[];
  if(T.done){
    out.push(h('section',{class:'card centered'},
      h('h2',null,'Brossage terminé'),
      h('p',{class:'sub'},'+'+T.gained+' points'+(T.auto?' · « '+T.auto+' » est coché':'')+'. Crache sans te rincer pour garder le fluor.')
    ));
  }
  out.push(h('section',{class:'card centered'},
    h('div',{class:'mouth'},svg),
    big,
    h('div',{class:'row',style:'justify-content:center'},sec),
    where,what,dots,controls
  ));
  out.push(h('section',{class:'card'},
    h('h2',null,'Musique'),
    h('p',{class:'sub'},url?'Lance ta playlist, puis reviens ici. Elle continue en arrière-plan.':'Ajoute le lien de ta playlist Spotify dans Réglages pour l’ouvrir d’ici.'),
    h('a',{class:'btn ghost',href:url||'https://open.spotify.com',target:'_blank',rel:'noopener'},url?'Ouvrir ma playlist':'Ouvrir Spotify')
  ));
  setTimeout(function(){ if(T.step>=0) paintStep(T.step); },0);
  return out;
}

function viewSettings(){
  var nameIn=h('input',{type:'text',id:'f-name',value:mine.name||'',maxlength:24,autocomplete:'off'});
  nameIn.addEventListener('change',function(){ var v=nameIn.value.trim().slice(0,24); if(v&&v!==mine.name){ mine.name=v; save(); render(true); toast('Prénom enregistré'); } });
  var plIn=h('input',{type:'url',id:'f-pl',value:mine.playlist||'',placeholder:'https://open.spotify.com/playlist/…'});
  plIn.addEventListener('change',function(){
    var v=plIn.value.trim();
    if(v===''){ mine.playlist=''; save(); toast('Lien retiré'); return; }
    if(!safeUrl(v)){ toast('Le lien doit commencer par https://'); return; }
    mine.playlist=v; save(); toast('Playlist enregistrée');
  });
  var addIn=h('input',{type:'text',id:'f-add',placeholder:'Ex. Crème solaire',maxlength:60,autocomplete:'off'});
  var slotSel=h('select',{id:'f-slot','aria-label':'Moment de la journée'},h('option',{value:'matin'},'Matin'),h('option',{value:'soir'},'Soir'));
  function doAdd(){ if(addTask(addIn.value,slotSel.value)){ addIn.value=''; } }
  addIn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  function list(slot,title){
    var l=mine.tasks.filter(function(t){return t.slot===slot;});
    return h('div',{class:'field'},
      h('label',null,title),
      l.length?h('div',{class:'list'},l.map(function(t){
        return h('div',{class:'item'},h('span',null,t.label),h('button',{class:'btn danger small',type:'button','aria-label':'Retirer '+t.label,onclick:function(){removeTask(t.id);}},'Retirer'));
      })):h('p',{class:'sub'},'Aucune tâche.')
    );
  }
  var quick=['Élastiques','Gouttières','Skincare','Vitamines','Fil dentaire','Boire un verre d’eau'];
  return [
    h('section',{class:'card'},
      h('h2',null,'Ton profil'),
      h('div',{class:'field'},h('label',{for:'f-name'},'Prénom affiché dans le duel'),nameIn)
    ),
    h('section',{class:'card'},
      h('h2',null,'Tes tâches'),
      list('matin','Matin'),
      list('soir','Soir'),
      h('div',{class:'field'},
        h('label',{for:'f-add'},'Ajouter une tâche'),
        h('div',{class:'row grow'},addIn,slotSel),
        h('button',{class:'btn',type:'button',onclick:doAdd},'Ajouter'),
        h('div',{class:'chips'},quick.map(function(q){
          return h('button',{class:'chip',type:'button',onclick:function(){addTask(q,slotNow());}},'+ '+q);
        }))
      ),
      h('p',{class:'sub'},'Retirer une tâche ne supprime pas les points déjà gagnés.')
    ),
    h('section',{class:'card'},
      h('h2',null,'Ta playlist'),
      h('div',{class:'field'},h('label',{for:'f-pl'},'Lien Spotify'),plIn),
      h('p',{class:'sub'},'Le site ne peut pas piloter Spotify lui-même. Il ouvre ta playlist dans l’app, et la musique continue pendant le minuteur.')
    ),
    h('section',{class:'card'},
      h('h2',null,'Jouer à deux'),
      h('p',{class:'sub'},'Partage cette page depuis le menu Partager, et donne à ta copine le droit de contribuer. Elle choisit son prénom et ses propres tâches, et vous apparaissez tous les deux dans l’onglet Duel.')
    )
  ];
}

function viewOnboard(){
  var nameIn=h('input',{type:'text',id:'o-name',placeholder:'Ton prénom',maxlength:24,value:onboard.name,autocomplete:'off'});
  nameIn.addEventListener('input',function(){ onboard.name=nameIn.value; });
  function group(slot,title){
    return h('div',{class:'field'},h('label',null,title),
      h('div',{class:'chips'},onboard.picks.map(function(p){
        if(p.slot!==slot) return null;
        return h('button',{class:'chip',type:'button','aria-pressed':p.on?'true':'false',onclick:function(){p.on=!p.on;render(true);}},p.label);
      }))
    );
  }
  return [
    h('section',{class:'card'},
      h('h2',null,'Bienvenue'),
      h('p',{class:'sub'},'Choisis ton prénom et tes tâches de départ. Tu pourras tout changer ensuite.'),
      h('div',{class:'field'},h('label',{for:'o-name'},'Prénom'),nameIn),
      group('matin','Le matin'),
      group('soir','Le soir'),
      h('button',{class:'btn',type:'button',onclick:function(){
        var name=onboard.name.trim().slice(0,24);
        if(!name){ toast('Entre ton prénom pour commencer'); nameIn.focus(); return; }
        mine={name:name,playlist:'',tasks:onboard.picks.filter(function(p){return p.on;}).map(function(p){return {id:uid(),label:p.label,slot:p.slot};}),days:{},brush:{}};
        if(myId) people[myId]=mine;
        save(); render(true);
      }},'Commencer')
    )
  ];
}

/* ---------- render ---------- */
function renderTabs(){
  var box=$('#tabs'); box.textContent='';
  TABS.forEach(function(t){
    var ic=s('svg',{viewBox:'0 0 24 24','aria-hidden':'true'}); ic.innerHTML=t.icon;
    box.appendChild(h('button',{class:'tab',type:'button','aria-current':tab===t.id?'page':null,onclick:function(){go(t.id);}},ic,t.label));
  });
}
function go(id){ tab=id; try{ if(location.hash!=='#'+id) location.hash=id; }catch(e){} render(true); window.scrollTo(0,0); }
function render(force){
  var main=$('#main');
  var ae=document.activeElement;
  if(!force&&ae&&main.contains(ae)&&/^(INPUT|SELECT)$/.test(ae.tagName)) return;
  if(!force&&tab==='brossage'&&T.running) return;
  var d=new Date();
  $('#date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var hr=d.getHours(), hi=hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir';
  $('#hello').textContent=mine&&mine.name?hi+' '+mine.name:'Routine Duo';
  var pill=$('#streakPill'); pill.textContent='';
  if(mine){ var st=stats(mine); pill.appendChild(h('span',{class:'pill warm'},'Série '+st.cur+' j')); }
  $('#notice').textContent='';
  if(local) $('#notice').appendChild(h('div',{class:'notice'},'Ta progression est enregistrée sur cet appareil uniquement. Le duel à deux demande la synchronisation en ligne.'));
  else if(slow&&!loaded) $('#notice').appendChild(h('div',{class:'notice'},'Les données sont lentes à répondre. Vérifie ta connexion.'));
  renderTabs();
  main.textContent='';
  if(!loaded){ main.appendChild(h('p',{class:'sub'},'Chargement…')); return; }
  if(!mine){ put(main,viewOnboard()); return; }
  var v=tab==='duel'?viewDuel():tab==='brossage'?viewBrush():tab==='reglages'?viewSettings():viewToday();
  put(main,v);
}

/* ---------- boot ---------- */
function fromHash(){ var id=(location.hash||'').slice(1); if(TABS.some(function(t){return t.id===id;})) tab=id; }
window.addEventListener('hashchange',function(){ fromHash(); render(true); });
fromHash();
render(true);
(async function(){
  var user=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      user=await window.claude.use('user');
    }
  }catch(e){ db=null; }
  if(user){ try{ myId=await user.id(); }catch(e){ myId=null; } }
  if(!db||!myId){
    local=true; myId='moi';
    try{ var raw=localStorage.getItem('routine-duo'); if(raw){ mine=JSON.parse(raw); mine.tasks=mine.tasks||[]; mine.days=mine.days||{}; mine.brush=mine.brush||{}; } }catch(e){ mine=null; }
    loaded=true; render(true); return;
  }
  var timer=setTimeout(function(){ if(!loaded){ slow=true; render(true); } },10000);
  db.collection('people').onSnapshot(function(snap){
    people={};
    snap.docs.forEach(function(d){ if(d.exists) people[d.id]=clone(d.data()); });
    if(people[myId]&&!saving&&!dirty){ mine=clone(people[myId]); mine.tasks=mine.tasks||[]; mine.days=mine.days||{}; mine.brush=mine.brush||{}; }
    if(!snap.metadata.fromCache||Object.keys(people).length){ loaded=true; clearTimeout(timer); }
    render(false);
  },function(){
    loaded=true; slow=true; clearTimeout(timer); render(true);
  });
})();
})();
</script>
